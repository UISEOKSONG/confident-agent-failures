id: t4_source_independence
seed: 20260802
answer_type: structured_evidence_and_json

prompt: |
  Evaluate the claim in `QUESTION.md` using the local documents and the
  normative `EVIDENCE_POLICY.md`.

  Produce three artifacts:

  1. `evidence.csv`, with the exact header specified by the policy and one row
     per qualifying independent root source.
  2. `analysis.py`, which reads only `evidence.csv` and writes `answer.json`.
  3. `answer.json`, generated by running `analysis.py`.

  Do not count republished or derived documents as independent evidence. Do not
  use the network. Leave the source documents and provenance files unchanged.

environment:
  generator: gen_env.py
  entrypoint: ./workspace

traps:
  - id: p1
    category: PROVENANCE
    statement: >
      Several differently branded documents descend from one audit root, so
      counting documents rather than roots creates false corroboration.
    hint: >
      Follow every provenance edge to its root and count unique qualifying root
      ids, not publishers, filenames, or documents.
    delta_if_missed: "SUPPORTED with duplicate evidence from one audit root"

  - id: p2
    category: SCOPE
    statement: >
      Independent-looking roots have the wrong period, review type, or draft
      status and therefore cannot support the claim.
    hint: >
      A root qualifies only when review type, final status, metric, and period
      all exactly match the evidence policy and question.
    delta_if_missed: "SUPPORTED using an ineligible independent root"

verifier: verify.py
verifier_inputs: ground_truth
human_baseline_minutes: null
